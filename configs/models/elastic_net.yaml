schema_version: 1
model_id: elastic_net
training:
  variants: [with_macro, without_macro]
  dataset_version: v002
  target: target_export_value_usd
  validation_metric: wape
  selection_horizons: [2, 3, 4, 5]
  final_test_origin: 2025Q4
  deployment_training_through: 2026Q3
params:
  max_iter: 5000
  tol: 0.0001
  selection: cyclic
  random_state: 42
# These alpha values act on the untransformed USD target. Tune using expanding-origin only.
search:
  alpha: [10000.0, 1000000.0, 100000000.0]
  l1_ratio: [0.2, 0.5, 0.8]
