schema_version: 1
model_id: kmeans
task: country_clustering
estimator: sklearn.cluster.KMeans
parameter_status: initial_experiment_not_final_cluster_count
params:
  n_clusters: 3
  init: k-means++
  n_init: 10
  max_iter: 300
  random_state: 42
inputs:
  row_key: [country_code, window_id]
  columns: [gdp_per_capita_usd, population, internet_users_pct]
  reference_year: three_year_window
  aggregation: complete_period_mean_with_observed_mean_for_latest_short_period
  fit_scope: eligible_observed_periods_for_retrospective_comparison
  shared_scaler_and_centroids_across_windows: true
  historical_backtest_claim: false
  scaler: StandardScaler
  missing: leave_country_unclassified
selection:
  candidate_cluster_counts: [2, 3, 4]
  criteria: [interpretability, cluster_sizes, silhouette_when_defined]
  require_more_complete_countries_than_clusters: true
output:
  display_original_values: true
  cluster_id_is_rank: false
  supervised_feature: false
