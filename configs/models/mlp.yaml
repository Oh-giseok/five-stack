schema_version: 1
model_id: mlp_64_32
params:
  hidden_layer_sizes: [64, 32]
  activation: relu
  solver: adam
  learning_rate_init: 0.001
  alpha: 0.0001
  batch_size: 256
  max_iter: 300
  random_state: 42
  early_stopping: false
  shuffle: false
selection:
  metric: validation_WAPE
  horizons: [2, 3, 4, 5]
  # Only the requested initial setting is currently authorized.
  candidates:
    initial: {}
  require_all_fits_converged: true
